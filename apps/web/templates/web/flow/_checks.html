{% load web_extras %}
<section class="card" aria-labelledby="chk-t">
  <h2 id="chk-t" class="card-title">{{ title }}</h2>
  <ul class="checks">
    {% for check in checks %}
    <li>
      <span class="check-dot {% if check.ok %}ok{% else %}ko{% endif %}" aria-hidden="true">
        {% if check.ok %}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>{% else %}!{% endif %}
      </span>
      <div><strong>{{ check.title }}</strong>{% if check.detail %}<div class="muted">{{ check.detail }}</div>{% endif %}</div>
    </li>
    {% endfor %}
  </ul>
</section>
