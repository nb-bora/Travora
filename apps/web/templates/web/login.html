{% extends "web/base.html" %}
{% block title %}Connexion · Travora{% endblock %}
{% block shell %}
<main id="main" class="auth">
  <form method="post" class="card auth-card">
    {% csrf_token %}
    <h1>Travora</h1>
    <p class="muted">Connectez-vous à votre agence.</p>
    {% if form.errors %}
      <p class="alert alert-danger" role="alert">Identifiant ou mot de passe incorrect.</p>
    {% endif %}
    <label for="id_username">Identifiant</label>
    <input id="id_username" name="username" autocomplete="username" autofocus required>
    <label for="id_password">Mot de passe</label>
    <input id="id_password" name="password" type="password" autocomplete="current-password" required>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-primary" type="submit">Se connecter</button>
  </form>
</main>
{% endblock %}
