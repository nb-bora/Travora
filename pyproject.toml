[project]
name = "travora"
version = "0.1.0"
description = "Gestion opérationnelle et financière pour agences de voyages"
requires-python = ">=3.14,<3.15"
dependencies = [
    "django>=6.1,<6.2",
    "psycopg[binary]>=3.1.12,<4",
    "gunicorn>=23.0",
    "whitenoise>=6.9",
    "weasyprint>=70,<71",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-django>=4.11",
    "pytest-cov>=6.0",
    "ruff>=0.15",
    "mypy>=1.18",
    "django-stubs>=5.2",
    "import-linter>=2.5",
    "pip-audit>=2.9",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "DJ", "PT", "C4"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405", "E402"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main"]
strict_optional = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["migrations/", "tests/"]

[tool.django-stubs]
django_settings_module = "config.settings.test"
