name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  POETRY_VERSION: "2.4.1"
  DEPLOY_SECRET_KEY: ci-only-key-0123456789-0123456789-0123456789-0123456789-abcdefghij

jobs:
  quality:
    name: Qualité du code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer Poetry
        run: pipx install "poetry==${POETRY_VERSION}"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry
      - run: poetry install --no-interaction
      - name: Verrou des dépendances à jour
        run: poetry check --lock
      - name: Lint
        run: poetry run ruff check .
      - name: Format
        run: poetry run ruff format --check .
      - name: Typage
        run: poetry run mypy apps config
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - name: Frontières entre applications
        run: poetry run lint-imports

  test:
    name: Tests (PostgreSQL 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: travora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Bibliothèques du rendu PDF et client PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core postgresql-client
      - name: Installer Poetry
        run: pipx install "poetry==${POETRY_VERSION}"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry
      - run: poetry install --no-interaction
      - name: Rôles PostgreSQL (propriétaire et exécution)
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d travora -v ON_ERROR_STOP=1 -f infra/postgres/roles.dev.sql
      - name: Aucune migration en attente
        run: poetry run python manage.py makemigrations --check --dry-run
      - name: Tests avec couverture
        run: poetry run pytest --cov --cov-report=term-missing:skip-covered --cov-report=xml --cov-fail-under=94
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  security:
    name: Sécurité et licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer Poetry
        run: pipx install "poetry==${POETRY_VERSION}"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry
      - run: poetry install --no-interaction
      - name: Vulnérabilités connues des dépendances
        run: poetry run pip-audit --progress-spinner off
      - name: Licences compatibles avec un SaaS fermé
        run: poetry run python tools/check_licenses.py
      - name: Contrôles de déploiement Django
        run: poetry run python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ${{ env.DEPLOY_SECRET_KEY }}
          DJANGO_ALLOWED_HOSTS: example.com

  image:
    name: Image de production
    needs: [quality, test, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Construire l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: travora:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Rendu PDF réel dans l'image
        run: |
          docker run --rm \
            -e DJANGO_SECRET_KEY=smoke -e DJANGO_ALLOWED_HOSTS=localhost \
            travora:ci python tools/smoke_image.py
      - name: Licences des seules dépendances de production
        run: docker run --rm travora:ci python tools/check_licenses.py
      - name: Exécution sans privilèges
        run: test "$(docker run --rm travora:ci id -u)" != "0"
